name: NEXUS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-retention-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx pandas numpy scikit-learn mlflow joblib pydantic

      - name: Run retention API contract tests
        run: |
          python -m pytest services/retention_api/test_api_contract.py -v