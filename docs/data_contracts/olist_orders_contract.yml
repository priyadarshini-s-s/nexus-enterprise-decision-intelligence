version: "1.0"

dataset:
  name: olist_orders
  layer: silver
  owner: nexus_data_platform
  description: >
    Order-level Silver dataset derived from the Olist Brazilian
    E-Commerce public dataset.

grain:
  description: "One record per Olist order."
  key:
    - order_id

schema:
  - name: order_id
    type: string
    nullable: false
    unique: true

  - name: customer_id
    type: string
    nullable: false

  - name: order_status
    type: string
    nullable: false
    accepted_values:
      - delivered
      - shipped
      - canceled
      - unavailable
      - invoiced
      - processing
      - created
      - approved

  - name: order_purchase_timestamp
    type: timestamp
    nullable: false

  - name: order_approved_at
    type: timestamp
    nullable: true

  - name: order_delivered_carrier_date
    type: timestamp
    nullable: true

  - name: order_delivered_customer_date
    type: timestamp
    nullable: true

  - name: order_estimated_delivery_date
    type: timestamp
    nullable: true

  - name: delivery_delay_days
    type: integer
    nullable: true

  - name: is_late_delivery
    type: integer
    nullable: false
    accepted_values:
      - 0
      - 1

quality_rules:

  - id: ORD-001
    rule: "order_id must be unique"
    severity: critical

  - id: ORD-002
    rule: "order_id must not be null"
    severity: critical

  - id: ORD-003
    rule: "customer_id must not be null"
    severity: critical

  - id: ORD-004
    rule: "order_purchase_timestamp must not be null"
    severity: critical

  - id: ORD-005
    rule: "order_status must belong to the accepted status domain"
    severity: critical

  - id: ORD-006
    rule: "is_late_delivery must be either 0 or 1"
    severity: critical

  - id: ORD-007
    rule: >
      When order_delivered_customer_date is present,
      it must not precede order_purchase_timestamp.
    severity: warning

  - id: ORD-008
    rule: >
      When order_status is delivered, missing delivery timestamp
      observations must be tracked explicitly rather than silently
      interpreted as not delivered.
    severity: warning

reconciliation:
  expected_order_population: 99441
  validation:
    - "Silver order count must reconcile with the profiled Olist source."
    - "Gold total_orders must reconcile with the Silver order population."

lineage:
  source: "Olist Brazilian E-Commerce Public Dataset"
  silver_output: "data/silver/olist_spark/orders"
  iceberg_table: "nexus.olist.orders"
  dbt_staging_model: "stg_olist_orders"
  dbt_intermediate_model: "int_olist_orders_enriched"
  dbt_gold_model: "fct_olist_order_performance"